services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comercial_estrella_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Tupass123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: comercial_estrella_init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "Tupass123!" -C -d master -i /init.sql

volumes:
  sqlserver_data: